    <text x="78" y="134" fill="#ffffff" font-size="58" font-weight="700" letter-spacing="-1">Rikard Andersson</text>
    <text x="82" y="190" fill="#83f3dc" font-size="25" font-weight="600" letter-spacing="2">BUILDING DEPENDABLE AI SYSTEMS</text>
    <text x="82" y="244" fill="#c9d8e7" font-size="22">Provider-neutral · Human-governed · Evidence-driven</text>
